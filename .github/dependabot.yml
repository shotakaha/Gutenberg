version: 2
updates:
  # npm devDependencies (the toolchain: gulp, sass, stylelint, husky, …)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # Conventional Commits — commitlint runs on every commit here.
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # One PR for routine minor/patch bumps; majors stay separate so they
      # can be reviewed on their own.
      dev-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions pinned in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
