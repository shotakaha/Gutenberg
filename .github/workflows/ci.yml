name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build only shells out to the pinned `sass` binary and runs
      # stylelint, so one current LTS is enough. engines.node requires >=20.19.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint SCSS
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is not in sync with scss/. Run 'npm run build' and commit the result."
            git --no-pager diff -- dist
            exit 1
          fi
