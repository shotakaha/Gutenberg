name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint SCSS
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is not in sync with scss/. Run 'npm run build' and commit the result."
            git --no-pager diff -- dist
            exit 1
          fi
